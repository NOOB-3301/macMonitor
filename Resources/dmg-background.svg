<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d14"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5d4"/>
      <stop offset="50%" style="stop-color:#00ccff"/>
      <stop offset="100%" style="stop-color:#7c4dff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="640" height="400" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="#1e1e2e" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="0" x2="640" y2="0"/>
    <line x1="0" y1="50" x2="640" y2="50"/>
    <line x1="0" y1="100" x2="640" y2="100"/>
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="0" y1="200" x2="640" y2="200"/>
    <line x1="0" y1="250" x2="640" y2="250"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="0" y1="350" x2="640" y2="350"/>
    <line x1="0" y1="400" x2="640" y2="400"/>
    <line x1="0" y1="0" x2="0" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
  </g>
  
  <!-- App icon position (left) -->
  <g transform="translate(160, 200)">
    <!-- App icon placeholder -->
    <rect x="-64" y="-64" width="128" height="128" rx="24" fill="#1e1e2e" stroke="url(#accent)" stroke-width="2" filter="url(#soft-glow)"/>
    <circle cx="0" cy="-10" r="30" fill="url(#accent)" opacity="0.2" filter="url(#glow)"/>
    <text x="0" y="10" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica, Arial" font-size="36" font-weight="700" fill="url(#accent)" filter="url(#soft-glow)">M</text>
    <text x="0" y="110" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica, Arial" font-size="18" font-weight="600" fill="white" opacity="0.9">macmon.app</text>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(320, 200)" filter="url(#soft-glow)">
    <path d="M-60,0 L60,0 M60,0 L40,-20 M60,0 L40,20" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="200" to="0" dur="2s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="55" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica, Arial" font-size="14" fill="white" opacity="0.7" letter-spacing="1">Drag to install</text>
  </g>
  
  <!-- Applications folder (right) -->
  <g transform="translate(480, 200)">
    <!-- Folder icon -->
    <path d="M-50,-40 L-20,-60 L50,-60 L50,40 L-50,40 Z" fill="#1e1e2e" stroke="url(#accent)" stroke-width="2" filter="url(#soft-glow)"/>
    <path d="M-50,-40 L-20,-60" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-10" r="18" fill="url(#accent)" opacity="0.15" filter="url(#glow)"/>
    <path d="M-12,0 L0,-12 L12,0" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <text x="0" y="110" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica, Arial" font-size="18" font-weight="600" fill="white" opacity="0.9">Applications</text>
  </g>
  
  <!-- Instructions at bottom -->
  <text x="320" y="360" text-anchor="middle" font-family="SF Pro Display, -apple-system, Helvetica, Arial" font-size="13" fill="white" opacity="0.5">macmon system monitor for macOS 14+</text>
</svg>