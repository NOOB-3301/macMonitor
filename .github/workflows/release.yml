name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build.sh

      - name: Create DMG
        run: |
          DMG_NAME="macmon-${GITHUB_REF_NAME}.dmg"
          hdiutil create -volname "macmon" -srcfolder "build/macmon.app" -ov -format UDZO "$DMG_NAME"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
        id: dmg

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.dmg_name }}
